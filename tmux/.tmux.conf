# Turn the mouse on
set-option -g mouse on

# Time in milliseconds for which tmux waits after an escape
set-option -g escape-time 0

# Enable supported focus events
set-option -g focus-events on

# History settings
set-option -g history-limit 50000

# Activity
set-option -g monitor-activity on
set-option -g visual-activity off

# Start window index at 1
set-option -g base-index 1

# Start pane index at 1
set-option -g pane-base-index 1

# Rename window to reflect current program
set-option -g -w automatic-rename on

# Renumber windows when one is closed
set-option -g renumber-windows on

# No bells at all
set-option -g bell-action none

# True color for the outer terminal. Keep the default screen-256color inside
# tmux: macOS system ncurses has no tmux-256color terminfo.
set-option -g default-terminal "screen-256color"
set-option -s -a terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"

# Clipboard integration (macOS first, Linux fallback)
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'set-option -g @copy_command "pbcopy"' \
  'if-shell "command -v xclip >/dev/null 2>&1" "set-option -g @copy_command \"xclip -selection clipboard -in\"" "set-option -g @copy_command \"cat >/dev/null\""'

# Use the default prefix key (C-a is left to the shell for beginning-of-line)
set-option -g prefix C-b

# Bind "C-b C-b" to send "C-b"
bind-key C-b send-prefix

# Reload configuration
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Switch panes
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Switch windows
unbind-key n
bind-key -n M-p previous-window
bind-key -n M-n next-window

# Split pane with same directory
unbind-key '"'
unbind-key '%'
bind-key '-' split-window -v -c "#{pane_current_path}"
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key '_' split-window -fv -c "#{pane_current_path}"
bind-key '|' split-window -fh -c "#{pane_current_path}"

# Resize panes
bind-key -n M-H resize-pane -L 2
bind-key -n M-J resize-pane -D 1
bind-key -n M-K resize-pane -U 1
bind-key -n M-L resize-pane -R 2

# Toggle zoom
bind-key -n M-z resize-pane -Z

# Move panes
unbind-key '{'
unbind-key '}'

# Kill pane
bind-key x kill-pane

# Kill window
unbind-key '&'
bind-key X kill-window

# Enter copy mode
bind-key -n M-v copy-mode

# Select
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# Cancel
bind-key -T copy-mode-vi Enter send-keys -X cancel

# Make mouse drag copy
set-option -s set-clipboard on
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# Jump search mode with prefix
bind-key '/' copy-mode \; send-keys "/"
bind-key '?' copy-mode \; send-keys "?"

# Status bar: transparent so it follows the terminal theme, blue as the accent
set-option -g status-position bottom
set-option -g status-justify left
set-option -g status-style "bg=default,fg=default"
set-option -g status-left-length 30
set-option -g status-left "#[fg=blue,bold]#S  "
set-option -g status-right-length 60
set-option -g status-right "#{?client_prefix,#[fg=yellow]PREFIX  ,}#[dim]#h"

# Window labels: natural width, Z marks a zoomed pane
setw -g window-status-separator "  "
setw -g window-status-format "#I:#W#{?window_zoomed_flag, Z,}"
setw -g window-status-current-format "#I:#W#{?window_zoomed_flag, Z,}"
setw -g window-status-style "dim"
setw -g window-status-current-style "fg=blue,bold"
setw -g window-status-activity-style "fg=yellow"

# Message / copy-mode selection
set-option -g message-style "bg=default,fg=blue,bold"
set-option -g mode-style "reverse"

# Pane borders: no title line, active pane marked by color
set-option -g pane-border-status off
set-option -g pane-border-style "fg=brightblack"
set-option -g pane-active-border-style "fg=blue"
